  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">Contoso Bank customer-service conversation</p>
      <h1>Shape a more connected service experience</h1>
      <p class="summary">

        with relevant context and consistent guidance across supported channels.
      </p>
      <div class="hero-actions">
        <button id="explore" type="button">What we heard</button>

  <main>
  <section id="what-we-heard" aria-labelledby="priorities-title">
    <p class="section-kicker">01 / What we heard</p>
    <h2 id="priorities-title">Priorities to confirm together</h2>
    <p class="summary">
      Based on the customer brief, these are our starting discussion points. We would like
      to test the language, relative importance, and scope with your team.
    </p>
    <div class="priority-grid">
      <article>
        <span class="item-number" aria-hidden="true">01</span>
        <h3>Reduce time spent waiting for service</h3>
        <p>Discuss where customers encounter delays across phone, chat, and online banking, and which moments matter most.</p>
      </article>
      <article>
        <span class="item-number" aria-hidden="true">02</span>
        <h3>Find trusted information more easily</h3>
        <p>Explore when customer-service representatives need better access to approved information during an interaction.</p>
      </article>
      <article>
        <span class="item-number" aria-hidden="true">03</span>
        <h3>Create consistent, personalized support</h3>
        <p>Clarify what a connected experience should feel like when customers move between service channels.</p>
      </article>
    </div>
  </section>

  <section id="future-state" class="section-band" aria-labelledby="future-state-title">

      <p class="section-kicker">02 / Future-state service experience</p>

        <div class="journey-arrow" aria-hidden="true">&#8594;</div>

        <div class="journey-arrow" aria-hidden="true">&#8594;</div>
        <article class="journey-step journey-result">
          <p class="journey-label">Resulting customer experience</p>
          <h3>A more coherent service conversation</h3>
          <p>The customer receives support informed by available context, with clearer continuity between supported channels.</p>
        </article>
      </div>
    </div>
  </section>

            <span>Design guided self-service experiences</span>
            <span class="capability-icon" aria-hidden="true"></span>

            <div><dt>Relevant scenario</dt><dd>Available profile and interaction data helps the service team understand context before engaging the customer.</dd></div>
            <div><dt>Priority connection</dt><dd>Supports the discussion about personalized support and cross-channel continuity.</dd></div>
          </dl>
        </div>
      </div>
    </div>
  </section>

        <p class="planning-label">Indicative scope</p>

      </article>
    </div>
  </section>
